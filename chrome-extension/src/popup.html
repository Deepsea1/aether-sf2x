<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aether — Truth Layer for AI</title>
  <style>
    body { width: 320px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .logo { width: 32px; height: 32px; border-radius: 8px; background: #6366f1; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
    .title { font-size: 14px; font-weight: 700; }
    .subtitle { font-size: 11px; color: #64748b; }
    .section { margin-bottom: 12px; }
    .label { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
    input { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
    button { width: 100%; padding: 8px; background: #6366f1; color: white; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    button:hover { background: #4f46e5; }
    .status { padding: 8px; border-radius: 6px; font-size: 12px; margin-top: 8px; }
    .status.ok { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .status.none { background: #fefce8; color: #854d0e; border: 1px solid #fef08a; }
    .link { display: block; text-align: center; margin-top: 12px; color: #6366f1; text-decoration: none; font-size: 12px; }
    .stats { display: flex; gap: 8px; margin-top: 12px; }
    .stat { flex: 1; text-align: center; padding: 8px; background: #f1f5f9; border-radius: 6px; }
    .stat-num { font-size: 18px; font-weight: 700; color: #6366f1; }
    .stat-label { font-size: 10px; color: #64748b; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Æ</div>
    <div>
      <div class="title">Aether</div>
      <div class="subtitle">The Truth Layer for AI</div>
    </div>
  </div>

  <div class="section">
    <div class="label">API Key</div>
    <input type="password" id="apiKey" placeholder="sk-aether-..." />
    <button id="save">Save Key</button>
    <div id="status" class="status none">No API key set</div>
  </div>

  <div class="section">
    <div class="label">This Session</div>
    <div class="stats">
      <div class="stat">
        <div class="stat-num" id="verifiedCount">0</div>
        <div class="stat-label">Verified</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="avgTrust">—</div>
        <div class="stat-label">Avg Trust</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="flaggedCount">0</div>
        <div class="stat-label">Flagged</div>
      </div>
    </div>
  </div>

  <a class="link" href="https://aether.sf2x.ai" target="_blank">Get an API key →</a>
  <a class="link" href="https://aether.sf2x.ai/benchmark" target="_blank">View benchmark →</a>
  <a class="link" href="https://aether.sf2x.ai/playground" target="_blank">Try the playground →</a>

  <script src="popup.js"></script>
</body>
</html>
