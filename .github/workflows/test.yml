name: test

# Runs the worker's unit tests on every pull request and every push to main.
#
# Why this exists: the mcp-worker suite is written with Node's built-in test runner
# (no dependencies), but tests only protect the repo if something actually runs them.
# Before this workflow the suite was inert — a change could break every alerting and
# comparison guarantee and still merge green, because nothing checked.
#
# No secrets are used and no network calls are made: every test injects its own fetch
# and none configures a vendor key, so this job can never reach a paid API.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-worker:
    name: mcp-worker unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `node --test` is built in, so there is nothing to install. Skipping the
      # install keeps the job fast and keeps a vendor dependency out of CI.
      - name: Run tests
        working-directory: mcp-worker
        run: npm test

      - name: Syntax-check the worker entry and modules
        working-directory: mcp-worker
        run: |
          for f in worker.js src/*.js; do
            node --check "$f"
          done
          echo "all modules parse"

  github-action:
    name: hallucination-guard gate tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The Action is dependency-free and runs from source, so there is nothing to
      # build — but the rule that fails a customer's build must stay covered.
      - name: Run gate tests
        run: node --test github-action/gate.test.mjs

      - name: Syntax-check the Action
        run: |
          node --check github-action/index.mjs
          node --check github-action/gate.mjs
          echo "action parses"

      - name: action.yml entrypoint must exist
        run: |
          main=$(grep -E "^\s*main:" github-action/action.yml | sed -E "s/.*main:\s*'?([^']+)'?.*/\1/")
          echo "action.yml main = $main"
          test -f "github-action/$main" || { echo "::error::action.yml points at github-action/$main which does not exist"; exit 1; }
          echo "entrypoint present"

  chrome-extension:
    name: extension endpoint + host permission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The packaged extension shipped calling a host that 404s, with
      # host_permissions locked to that same dead host — so Chrome would have blocked
      # the correct one even after a URL fix. Nothing caught it. This does.
      - name: manifest host_permissions must cover the host the code calls
        run: |
          set -euo pipefail
          rm -rf /tmp/ext && mkdir -p /tmp/ext
          unzip -q chrome-extension/aether-extension.zip -d /tmp/ext
          cd /tmp/ext/extension

          if grep -rn "api\.base44\.com" manifest.json background.js content.js; then
            echo "::error::the extension references api.base44.com, which returns 404"
            exit 1
          fi
          if grep -rnE "['\"]Authorization['\"]" background.js content.js; then
            echo "::error::the extension sends an Authorization header; the API requires x-api-key"
            exit 1
          fi

          python3 - <<'PY'
          import json, re, sys, urllib.parse
          m = json.load(open('manifest.json'))
          hosts = m.get('host_permissions') or []
          allowed = {urllib.parse.urlparse(h.replace('*://','https://')).hostname for h in hosts}
          called = set()
          for f in ('background.js', 'content.js'):
              called |= set(re.findall(r'https://([a-z0-9.\-]+)/', open(f).read()))
          missing = {h for h in called if h not in allowed}
          print('host_permissions:', sorted(allowed))
          print('hosts called    :', sorted(called))
          if missing:
              print(f'::error::called host(s) {sorted(missing)} are not in host_permissions — Chrome will block them')
              sys.exit(1)
          print('every called host is permitted')
          PY

  app-shared:
    name: P4 shared-module unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The P4 rails (independence clustering §5.6, display eligibility §20,
      # service modes §15, capability-card gate §18.2) are pure modules under
      # app/base44/shared/ — deployed inside Deno functions but testable with
      # plain node (app/package.json is type:module; base44:runtime is only
      # ever imported lazily). These tests lock the fail-closed contracts the
      # warrant pipeline depends on.
      - name: Run shared-module tests
        run: node --test "app/base44/shared/tests/*.test.mjs"

      # The live-verification suite ships in the repo (it replaced the ad-hoc
      # session harnesses). No network here — just keep it loadable.
      - name: Syntax-check the live suite
        run: node --check scripts/verify-live.mjs

  sdk:
    name: SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The JS SDK injects its own fetch in every test — no network, no key.
      - name: JavaScript SDK tests
        run: node --test sdk/aether_sdk.test.mjs

      - name: Python SDK compiles and imports
        run: |
          pip install --quiet requests
          python -m py_compile sdk/aether_sdk.py
          python -c "import sys; sys.path.insert(0, 'sdk'); from aether_sdk import AetherClient, NotDeployedError; print('python sdk imports')"

      # The base URL and auth header were both wrong across this repo once. These two
      # greps keep the shipped clients from regressing to the broken values.
      - name: Shipped SDKs must not use the dead base URL or Bearer auth
        run: |
          # Matches QUOTED usage only. A looser pattern also matched the comments
          # that explain these very fixes, which would fail the job on its own docs.
          if grep -nE "['\"]https://api\.base44\.com" sdk/aether_sdk.py sdk/aether_sdk.js; then
            echo "::error::an SDK points at the api.base44.com base, which returns 404"
            exit 1
          fi
          if grep -nE "['\"]Authorization['\"]" sdk/aether_sdk.py sdk/aether_sdk.js; then
            echo "::error::an SDK sets an Authorization header; the Aether API requires x-api-key"
            exit 1
          fi
          echo "shipped SDKs use the live base URL and x-api-key"
