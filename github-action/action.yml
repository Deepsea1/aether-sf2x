name: 'Aether Hallucination Guard'
description: 'Verify AI responses and PR claims in your CI/CD pipeline. Advisory by default; enforcing mode fails the build on blocked or review-required claims.'
author: 'SF2X'
branding:
  icon: 'shield'
  color: 'black'

inputs:
  api-key:
    description: 'Aether API key. The API requires one — without it the request is rejected with 401.'
    required: false
    default: ''
  api-url:
    description: 'Override the Aether verifyResponse endpoint. Defaults to the live app-domain route.'
    required: false
    default: ''
  text:
    description: 'Text to verify (or path to a file containing text)'
    required: true
  mode:
    description: >-
      Gate mode. "advisory" (default) reports findings — annotations plus a
      would-have-blocked summary — but NEVER fails the build. "enforcing" fails on
      blocked claims and high-materiality review claims (or, against an older server
      that sends no claim dispositions, on the legacy threshold rule). BREAKING
      DEFAULT in v2: v1 blocked by default — to keep blocking, set mode: enforcing.
    required: false
    default: 'advisory'
  threshold:
    description: >-
      Minimum trust score to pass (0-100). DEPRECATED: consulted only when the
      server response carries no per-claim dispositions (older servers), and only
      enforced in enforcing mode; ignored otherwise — no single score is the
      decision.
    required: false
    default: '80'
  fail-on-contested:
    description: >-
      Fail the build if verdict is "contested" (not just "rejected"). Legacy
      (no-dispositions) responses only, and only in enforcing mode.
    required: false
    default: 'false'

outputs:
  trust-score:
    description: 'Trust score of the verified text (0-100); 0 when the server sends dispositions instead'
  verdict:
    description: 'Tribunal verdict (verified, contested, rejected); "unknown" when the server sends dispositions instead'
  corrections:
    description: 'JSON array of corrections issued by the tribunal'
  gate-decision:
    description: "The server's own gate_decision (passed, warned, requires_review, blocked) when present; empty for legacy responses"
  dispositions:
    description: 'JSON array of per-claim dispositions ({disposition, materiality, category, file_path, diff_line, text}); empty for legacy responses'
  truth-status:
    description: 'Canonical factual status; UNKNOWN when the server does not expose a final factual decision'
  evidence-basis:
    description: 'Canonical evidence basis, kept separate from score and verdict'
  proof-level:
    description: 'Canonical proof level (L0-L8)'
  integrity-status:
    description: 'Canonical decision-record integrity status'
  action-authorization:
    description: 'Canonical action authorization; never inferred from a factual status'

runs:
  using: 'node20'
  # Points at the source directly: the Action has no dependencies, so there is no
  # bundle to build. This previously read `dist/index.js`, which does not exist in
  # the repository — the Action could not load at all.
  main: 'index.mjs'
