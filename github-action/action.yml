name: 'Aether Hallucination Guard'
description: 'Verify AI responses in your CI/CD pipeline. Fails the build if hallucinations are detected.'
author: 'SF2X'
branding:
  icon: 'shield'
  color: 'black'

inputs:
  api-key:
    description: 'Aether API key. The API requires one — without it the request is rejected with 401.'
    required: false
    default: ''
  api-url:
    description: 'Override the Aether verifyResponse endpoint. Defaults to the live app-domain route.'
    required: false
    default: ''
  text:
    description: 'Text to verify (or path to a file containing text)'
    required: true
  threshold:
    description: 'Minimum trust score to pass (0-100)'
    required: false
    default: '80'
  fail-on-contested:
    description: 'Fail the build if verdict is "contested" (not just "rejected")'
    required: false
    default: 'false'

outputs:
  trust-score:
    description: 'Trust score of the verified text (0-100)'
  verdict:
    description: 'Tribunal verdict (verified, contested, rejected)'
  corrections:
    description: 'JSON array of corrections issued by the tribunal'

runs:
  using: 'node20'
  # Points at the source directly: the Action has no dependencies, so there is no
  # bundle to build. This previously read `dist/index.js`, which does not exist in
  # the repository — the Action could not load at all.
  main: 'index.mjs'
